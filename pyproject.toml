[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bao"
version = "0.1.0"
description = "出口报关文件编织助手"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "typer>=0.9",
    "rich>=13.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "PyPDF2>=3.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.28"]
dev = ["pytest>=7.0"]

[project.scripts]
bao = "bao.cli:app"

[tool.setuptools.packages.find]
where = ["."]
