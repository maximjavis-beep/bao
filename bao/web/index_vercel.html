<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bao — 出口报关文件编织助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px/1.5 -apple-system,system-ui,sans-serif;background:#f5f7fa;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1a2e;color:#fff;padding:8px 20px;display:flex;align-items:center;gap:10px}
.header h1{font-size:16px;font-weight:600}
.header .ver{font-size:11px;color:#889}
.section-divider{height:4px;background:linear-gradient(90deg,#e67e22,#4a90d9)}
.top-section{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 16px;display:flex;gap:10px;align-items:flex-start;min-height:0;flex-shrink:0}
.top-left{display:flex;flex-direction:column;gap:6px;width:260px;flex-shrink:0}
.top-center{flex:1;overflow-y:auto;max-height:160px}
.top-right{width:200px;flex-shrink:0}
.section-title{font-size:12px;font-weight:700;color:#555;margin-bottom:4px;padding-bottom:3px;border-bottom:2px solid #e67e22;text-transform:uppercase;letter-spacing:.5px}
.section-title-bao{border-bottom-color:#4a90d9}
.upload-zone{border:2px dashed #c0c0c0;border-radius:6px;padding:12px 10px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.active{border-color:#e67e22;background:#fff8f0}
.upload-zone-bao:hover,.upload-zone-bao.active{border-color:#4a90d9;background:#f0f6ff}
.upload-zone input{display:none}
.upload-zone .icon{font-size:20px;margin-bottom:2px}
.upload-zone .text{color:#888;font-size:11px}
.btn{display:block;width:100%;padding:8px;border:none;border-radius:4px;font-size:12px;cursor:pointer;text-align:center;transition:all .2s}
.btn-plan{background:#e67e22;color:#fff}.btn-plan:hover{background:#d35400}.btn-plan:disabled{background:#ccc;cursor:not-allowed}
.btn-dl{background:#27ae60;color:#fff;text-decoration:none;display:none}.btn-dl:hover{background:#219a52}
.main-section{flex:1;display:flex;overflow:hidden}
.panel{padding:12px;overflow-y:auto}
.panel-left{width:300px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;gap:6px}
.panel-center{flex:1;background:#fff}
.panel-right{width:260px;background:#fafbfc;border-left:1px solid #e0e0e0}
.file-badge{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#e8f4ff;border-radius:4px;font-size:11px;margin-bottom:3px}
.file-badge .idx{color:#4a90d9;font-weight:600;min-width:16px}
.file-badge .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-badge .remove{cursor:pointer;color:#999;margin-left:4px}
.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357abd}.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-batch{background:#8e44ad;color:#fff;margin-top:3px}.btn-batch:hover{background:#71368a}.btn-batch:disabled{background:#ccc;cursor:not-allowed}
.btn-zip{background:#e67e22;color:#fff;text-decoration:none}.btn-zip:hover{background:#d35400}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.info-card{background:#f8faff;border-radius:4px;padding:8px 10px;text-align:center}
.info-card .num{font-size:18px;font-weight:700;color:#4a90d9}
.info-card .lbl{font-size:10px;color:#888;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f0f3f8;padding:6px 8px;text-align:left;font-weight:600;border-bottom:2px solid #ddd;position:sticky;top:0}
td{padding:5px 8px;border-bottom:1px solid #eee}
tr:hover td{background:#f8faff}
.empty{text-align:center;padding:30px;color:#999}
.empty .icon{font-size:36px;margin-bottom:8px}
.toast{position:fixed;bottom:16px;right:16px;padding:10px 18px;border-radius:4px;color:#fff;font-size:12px;z-index:999;display:none}
.toast-error{background:#e74c3c}.toast-info{background:#4a90d9}
.hs-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.hs-row label{font-size:12px;color:#666;white-space:nowrap}
.hs-row input{flex:1;padding:6px;border:1px solid #ddd;border-radius:3px;font-size:12px}
.loading{text-align:center;padding:30px;color:#888}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #ddd;border-top-color:#4a90d9;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.batch-result{margin-top:6px;max-height:200px;overflow-y:auto}
.batch-result .ok{color:#27ae60}.batch-result .fail{color:#e74c3c}
.plan-info{font-size:11px;color:#888;margin-top:2px}
</style>
</head>
<body>
<div class="header"><h1>📦 bao</h1><span class="ver">v0.3.0 — 出口报关文件编织助手</span></div>
<div class="top-section">
<div class="top-left">
<div class="section-title">📋 调整明细 → 发货计划</div>
<label class="upload-zone" id="plan-drop-zone"><input type="file" id="plan-file-input" accept=".xlsx" onchange="handlePlanFile(this)"><div class="icon">📁</div><div class="text">上传调整明细 Excel</div></label>
<div class="plan-info" id="plan-file-info"></div>
<button class="btn btn-plan" id="plan-gen-btn" disabled onclick="doMergePlan()">🔀 生成发货计划</button>
<a class="btn btn-dl" id="plan-dl-btn" href="#" style="display:none">⬇ 下载发货计划</a>
</div>
<div class="top-center" id="plan-preview"><div class="empty"><div class="icon">📋</div>上传调整明细后点击生成</div></div>
<div class="top-right" id="plan-summary"><div class="section-title">📊 映射统计</div><div class="empty">等待上传…</div></div>
</div>
<div class="section-divider"></div>
<div class="main-section">
<div class="panel panel-left">
<div class="section-title section-title-bao">📤 FBA 装箱单生成</div>
<label class="upload-zone upload-zone-bao" id="drop-zone"><input type="file" id="file-input" accept=".xlsx" multiple onchange="handleFiles(this)"><div class="icon">📁</div><div class="text">拖拽或点击上传 FBA 货件</div></label>
<div class="file-list" id="file-list"></div>
<div class="hs-row"><label>HS编码：</label><input type="text" id="hs-code" placeholder="自动匹配（蜡烛:3406000090）"></div>
<button class="btn btn-primary" id="gen-btn" disabled onclick="doGenerateSingle()">🧵 单件生成</button>
<a class="btn btn-dl btn-download" id="dl-btn" style="display:none" href="#">⬇ 下载装箱单</a>
<button class="btn btn-batch" id="gen-batch-btn" disabled onclick="doGenerateBatch()">📦 批量生成</button>
<div class="batch-result" id="batch-result"></div>
</div>
<div class="panel panel-center" id="preview"><div class="empty"><div class="icon">📋</div>上传 FBA 货件 Excel 开始</div></div>
<div class="panel panel-right" id="summary"><div class="section-title section-title-bao">📊 货件信息</div><div class="empty">等待上传…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
let state={files:[],parsed:null,planFile:null},toastTimer;

let pdz=document.getElementById('plan-drop-zone');
pdz.addEventListener('dragover',e=>{e.preventDefault();pdz.classList.add('active')});
pdz.addEventListener('dragleave',()=>pdz.classList.remove('active'));
pdz.addEventListener('drop',e=>{e.preventDefault();pdz.classList.remove('active');document.getElementById('plan-file-input').files=e.dataTransfer.files;handlePlanFile(document.getElementById('plan-file-input'))});

function handlePlanFile(i){if(i.files.length===0)return;state.planFile=i.files[0];document.getElementById('plan-file-info').textContent='✓ '+esc(state.planFile.name);document.getElementById('plan-gen-btn').disabled=false}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function doMergePlan(){
if(!state.planFile)return toast('请先上传',true);
let btn=document.getElementById('plan-gen-btn');btn.disabled=true;btn.textContent='⏳ 生成中…';
let fd=new FormData();fd.append('file',state.planFile);
fetch('/api/merge-plan',{method:'POST',body:fd}).then(r=>{
if(!r.ok){toast('生成失败',true);btn.disabled=false;btn.textContent='🔀 生成发货计划';return}
var cnt=r.headers.get('X-Bao-Row-Count')||'?';
return r.blob().then(function(blob){
btn.disabled=false;btn.textContent='🔀 生成发货计划';
var url=URL.createObjectURL(blob);
var isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
if(isIOS){window.location.href=url}else{var a=document.createElement('a');a.href=url;a.download='发货计划.xlsx';document.body.appendChild(a);a.click();document.body.removeChild(a)}
var dl=document.getElementById('plan-dl-btn');dl.onclick=function(){var u=URL.createObjectURL(blob);if(isIOS){window.location.href=u}else{var a=document.createElement('a');a.href=u;a.download='发货计划.xlsx';document.body.appendChild(a);a.click();document.body.removeChild(a)}};dl.href='javascript:void(0)';dl.style.display='block';dl.textContent='⬇ 重新下载';
toast('✓ 生成完成 — '+cnt+' 行');
document.getElementById('plan-summary').innerHTML='<div class="section-title">📊 映射统计</div><div class="info-grid"><div class="info-card"><div class="num" style="color:#e67e22">'+cnt+'</div><div class="lbl">映射行数</div></div></div>';
document.getElementById('plan-preview').innerHTML='<div class="empty"><div class="icon" style="font-size:28px">✅</div>生成完成<br><span style="font-size:11px;color:#888">'+cnt+' 行已映射到发货计划</span></div>';
}).catch(function(){btn.disabled=false;btn.textContent='🔀 生成发货计划';toast('失败',true)})
})

let dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('active')});
dz.addEventListener('dragleave',()=>dz.classList.remove('active'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('active');document.getElementById('file-input').files=e.dataTransfer.files;handleFiles(document.getElementById('file-input'))});

function toast(m,e){let t=document.getElementById('toast');t.textContent=m;t.className='toast '+(e?'toast-error':'toast-info');t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3000)}

function handleFiles(i){state.files=Array.from(i.files);renderFileList();if(state.files.length===1)parseSingle(state.files[0]);else if(state.files.length>1){document.getElementById('gen-btn').disabled=true;document.getElementById('gen-batch-btn').disabled=false;document.getElementById('preview').innerHTML='<div class="empty"><div class="icon">📁</div>已选择 '+state.files.length+' 个文件<br><span style="font-size:12px;color:#aaa">点击「批量生成」</span></div>';document.getElementById('summary').innerHTML='<div class="section-title section-title-bao">📊 货件信息</div><div class="empty">'+state.files.length+' 个文件待处理</div>'}}

function renderFileList(){let h='';state.files.forEach((f,i)=>{h+='<div class="file-badge"><span class="idx">'+(i+1)+'</span><span class="name" title="'+esc(f.name)+'">'+esc(f.name)+'</span><span class="remove" onclick="removeFile('+i+')">✕</span></div>'});document.getElementById('file-list').innerHTML=h}

function removeFile(i){state.files.splice(i,1);let dt=new DataTransfer();state.files.forEach(f=>dt.items.add(f));document.getElementById('file-input').files=dt.files;renderFileList();if(state.files.length===0)clearAll();else if(state.files.length===1)parseSingle(state.files[0])}

function parseSingle(f){document.getElementById('preview').innerHTML='<div class="loading"><span class="spinner"></span>解析中…</div>';document.getElementById('gen-btn').disabled=true;document.getElementById('gen-batch-btn').disabled=true;document.getElementById('dl-btn').style.display='none';document.getElementById('batch-result').innerHTML='';let fd=new FormData();fd.append('file',f);fetch('/api/parse',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{if(!d.success){toast('解析失败: '+d.error,true);document.getElementById('preview').innerHTML='<div class="empty"><div class="icon">❌</div>'+d.error+'</div>';return}state.parsed=d;showPreview(d);showSummary(d);document.getElementById('gen-btn').disabled=false;document.getElementById('gen-batch-btn').disabled=false;toast('✓ 解析成功 — '+d.item_count+' 个 SKU')}).catch(()=>toast('上传失败',true))}

function clearAll(){state={files:[],parsed:null};document.getElementById('file-list').innerHTML='';document.getElementById('file-input').value='';document.getElementById('gen-btn').disabled=true;document.getElementById('gen-batch-btn').disabled=true;document.getElementById('dl-btn').style.display='none';document.getElementById('batch-result').innerHTML='';document.getElementById('preview').innerHTML='<div class="empty"><div class="icon">📋</div>上传 FBA 货件 Excel 开始</div>';document.getElementById('summary').innerHTML='<div class="section-title section-title-bao">📊 货件信息</div><div class="empty">等待上传…</div>'}

function showPreview(d){let h='<div class="section-title">📋 SKU 明细</div>';if(!d.items||d.items.length===0)h+='<div class="empty">无数据</div>';else{h+='<table><tr><th>MSKU</th><th>箱数</th><th>申报量</th><th>箱号</th><th>重量</th><th>尺寸</th></tr>';d.items.forEach(i=>{h+='<tr><td>'+esc(i.msku)+'</td><td>'+i.box_count+'</td><td>'+i.declared_qty+'</td><td>'+esc(i.box_range)+'</td><td>'+i.weight+'</td><td>'+i.length+'×'+i.width+'×'+i.height+'</td></tr>'});h+='</table>'}document.getElementById('preview').innerHTML=h}

function showSummary(d){let m=d.meta||{},h='<div class="section-title section-title-bao">📊 货件信息</div><div class="info-grid">';h+='<div class="info-card"><div class="num">'+(m.total_boxes||'-')+'</div><div class="lbl">箱子数量</div></div>';h+='<div class="info-card"><div class="num">'+(d.item_count||'-')+'</div><div class="lbl">SKU 数</div></div>';h+='<div class="info-card"><div class="num">'+(m.item_count||'-')+'</div><div class="lbl">商品数量</div></div>';h+='<div class="info-card"><div class="num">'+(m.sku_count||'-')+'</div><div class="lbl">SKU 种类</div></div>';h+='</div>';if(m.shipment_id)h+='<div style="padding:6px;background:#f0f6ff;border-radius:4px;margin-bottom:6px"><span style="color:#888;font-size:11px">货件编号</span><br><b>'+esc(m.shipment_id)+'</b></div>';document.getElementById('summary').innerHTML=h}

function doGenerateSingle(){if(state.files.length===0)return toast('请先上传',true);let btn=document.getElementById('gen-btn');btn.disabled=true;btn.textContent='⏳ 生成中…';let fd=new FormData();fd.append('file',state.files[0]);let hs=document.getElementById('hs-code').value.trim();if(hs)fd.append('hs_code',hs);fetch('/api/weave',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{btn.disabled=false;btn.textContent='🧵 单件生成';if(!d.success){toast('失败: '+d.error,true);return}downloadB64(d.file_b64,'装箱单.xlsx');let dl=document.getElementById('dl-btn');dl.onclick=function(){downloadB64(d.file_b64,'装箱单.xlsx')};dl.href='javascript:void(0)';dl.style.display='block';dl.textContent='⬇ 重新下载';showResultSummary(d);showResultRows(d);toast('✓ 生成完成')}).catch(()=>{btn.disabled=false;btn.textContent='🧵 单件生成';toast('失败',true)})}

function doGenerateBatch(){if(state.files.length===0)return toast('请先上传',true);let fd=new FormData();state.files.forEach(f=>fd.append('files',f));let hs=document.getElementById('hs-code').value.trim();if(hs)fd.append('hs_code',hs);let btn=document.getElementById('gen-batch-btn');btn.disabled=true;btn.textContent='⏳ 批量中…';document.getElementById('batch-result').innerHTML='<div class="loading"><span class="spinner"></span>处理 '+state.files.length+' 个…</div>';fetch('/api/weave-batch',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{btn.disabled=false;btn.textContent='📦 批量生成';if(!d.success){toast('失败: '+d.error,true);return}showBatchResult(d);toast('✓ '+d.results.filter(r=>r.success).length+'/'+d.results.length+' 成功')}).catch(()=>{btn.disabled=false;btn.textContent='📦 批量生成';toast('失败',true)})}

function showBatchResult(d){let h='<div style="margin-top:6px">';if(d.zip_b64)h+='<a class="btn btn-zip" href="javascript:void(0)" onclick="downloadZipB64(\''+d.zip_b64+'\')" style="margin-bottom:6px;font-size:11px;padding:6px;display:block;text-align:center">📥 批量下载 ZIP</a>';d.results.forEach(r=>{if(r.success)h+='<div style="font-size:11px;padding:3px 0"><span class="ok">✓</span> '+esc(r.shipment_id)+' <a href="javascript:void(0)" onclick="downloadB64(\''+r.file_b64+'\',\''+esc(r.shipment_id)+'-装箱单.xlsx\')" style="color:#4a90d9;font-size:10px">下载</a></div>';else h+='<div style="font-size:11px;padding:3px 0"><span class="fail">✗</span> '+esc(r.filename)+' — '+esc(r.error)+'</div>'});h+='</div>';document.getElementById('batch-result').innerHTML=h;document.getElementById('summary').innerHTML='<div class="section-title section-title-bao">📊 批量生成</div><div class="info-grid"><div class="info-card"><div class="num">'+d.results.length+'</div><div class="lbl">文件数</div></div><div class="info-card"><div class="num" style="color:#27ae60">'+d.results.filter(r=>r.success).length+'</div><div class="lbl">成功</div></div></div>'}

function showResultSummary(d){let s=d.summary||{},h='<div class="section-title section-title-bao">📊 生成结果</div><div class="info-grid">';h+='<div class="info-card"><div class="num">'+(s.total_boxes||'-')+'</div><div class="lbl">总箱数</div></div>';h+='<div class="info-card"><div class="num">'+(s.total_weight||'-')+'</div><div class="lbl">总重量 kg</div></div>';h+='<div class="info-card"><div class="num">'+(s.total_cbm||'-')+'</div><div class="lbl">总体积 CBM</div></div>';h+='<div class="info-card"><div class="num">'+(s.row_count||'-')+'</div><div class="lbl">数据行</div></div>';h+='</div>';if(s.shipment_id)h+='<div style="padding:6px;background:#eafaf1;border-radius:4px;font-size:11px;color:#666">Shipment ID: <b>'+esc(s.shipment_id)+'</b></div>';document.getElementById('summary').innerHTML=h}

function showResultRows(d){let rows=d.rows||[],h='<div class="section-title">📋 装箱单明细</div><table><tr><th>箱号段</th><th>件数</th><th>SKU</th><th>HS</th><th>数量</th><th>重量</th><th>尺寸</th></tr>';rows.forEach(r=>{h+='<tr><td>'+esc(r['箱号段'])+'</td><td>'+r['总件数']+'</td><td>'+esc(r['SKU'])+'</td><td>'+esc(r['海关编码'])+'</td><td>'+r['总数量']+'</td><td>'+r['单箱重量']+'</td><td>'+r['长']+'×'+r['宽']+'×'+r['高']+'</td></tr>'});h+='</table>';document.getElementById('preview').innerHTML=h}

function downloadB64(b64,filename){var raw=atob(b64),arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);var blob=new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob);var isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);if(isIOS){window.location.href=url}else{var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a)}setTimeout(function(){URL.revokeObjectURL(url)},60000)}
function downloadZipB64(b64){let raw=atob(b64),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);let blob=new Blob([arr],{type:'application/zip'}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='装箱单_批量.zip';a.click();URL.revokeObjectURL(url)}
</script>
</body>
</html>
