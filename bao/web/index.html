<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bao — FBA 装箱单生成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 -apple-system,system-ui,sans-serif;background:#f5f7fa;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1a2e;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:600}
.header .ver{font-size:12px;color:#889;margin-left:8px}
.main{display:flex;flex:1;overflow:hidden}
.panel{padding:16px;overflow-y:auto}
.panel-left{width:320px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;gap:8px}
.panel-center{flex:1;background:#fff}
.panel-right{width:280px;background:#fafbfc;border-left:1px solid #e0e0e0}
.upload-zone{border:2px dashed #c0c0c0;border-radius:8px;padding:22px 16px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.active{border-color:#4a90d9;background:#f0f6ff}
.upload-zone input{display:none}
.upload-zone .icon{font-size:28px;margin-bottom:6px}
.upload-zone .text{color:#888;font-size:13px}
.upload-zone .hint{color:#aaa;font-size:11px;margin-top:2px}
.file-list{max-height:200px;overflow-y:auto}
.file-badge{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#e8f4ff;border-radius:6px;font-size:12px;margin-bottom:4px}
.file-badge .idx{color:#4a90d9;font-weight:600;min-width:20px}
.file-badge .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-badge .remove{cursor:pointer;color:#999;font-size:14px}
.btn{display:block;width:100%;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer;text-align:center;transition:all .2s}
.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357abd}.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-batch{background:#8e44ad;color:#fff;margin-top:4px}.btn-batch:hover{background:#71368a}.btn-batch:disabled{background:#ccc;cursor:not-allowed}
.btn-download{background:#27ae60;color:#fff;text-decoration:none}.btn-download:hover{background:#219a52}
.btn-zip{background:#e67e22;color:#fff;text-decoration:none}.btn-zip:hover{background:#d35400}
.section-title{font-size:14px;font-weight:600;color:#333;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #4a90d9}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-card{background:#f8faff;border-radius:6px;padding:10px 12px;text-align:center}
.info-card .num{font-size:22px;font-weight:700;color:#4a90d9}
.info-card .lbl{font-size:11px;color:#888;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f0f3f8;padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid #ddd;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #eee}
tr:hover td{background:#f8faff}
.empty{text-align:center;padding:40px;color:#999}
.empty .icon{font-size:40px;margin-bottom:10px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:6px;color:#fff;font-size:13px;z-index:999;display:none}
.toast-error{background:#e74c3c}.toast-info{background:#4a90d9}
.hs-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.hs-row label{font-size:13px;color:#666;white-space:nowrap}
.hs-row input{flex:1;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.loading{text-align:center;padding:40px;color:#888}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid #ddd;border-top-color:#4a90d9;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.batch-result{margin-top:8px;max-height:240px;overflow-y:auto}
.batch-result .ok{color:#27ae60}
.batch-result .fail{color:#e74c3c}
</style>
</head>
<body>

<div class="header">
  <h1>📦 bao</h1>
  <span class="ver">v0.2.0 — FBA 装箱单生成</span>
</div>

<div class="main">
  <div class="panel panel-left">
    <div class="section-title">📤 上传 FBA 货件</div>
    <label class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".xlsx" multiple onchange="handleFiles(this)">
      <div class="icon">📁</div>
      <div class="text">拖拽或点击上传</div>
      <div class="hint">支持多选 — FBA 货件导出 Excel (.xlsx)</div>
    </label>
    <div class="file-list" id="file-list"></div>

    <div class="hs-row" style="margin-top:4px">
      <label>HS编码：</label>
      <input type="text" id="hs-code" placeholder="自动匹配（蜡烛:3406000090）">
    </div>
    <button class="btn btn-primary" id="gen-btn" disabled onclick="doGenerateSingle()">🧵 单件生成</button>
    <a class="btn btn-download" id="dl-btn" style="display:none" href="#" download>⬇ 下载装箱单</a>
    <button class="btn btn-batch" id="gen-batch-btn" disabled onclick="doGenerateBatch()">📦 批量生成</button>
    <div class="batch-result" id="batch-result"></div>
  </div>
  <div class="panel panel-center" id="preview">
    <div class="empty"><div class="icon">📋</div>上传 FBA 货件 Excel 开始</div>
  </div>
  <div class="panel panel-right" id="summary">
    <div class="section-title">📊 货件信息</div>
    <div class="empty">等待上传…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let state = { files: [], parsed: null, woven: null, batchResult: null };
let toastTimer;

let dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
dz.addEventListener('dragleave', () => dz.classList.remove('active'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('active');
  document.getElementById('file-input').files = e.dataTransfer.files;
  handleFiles(document.getElementById('file-input'));
});

function toast(msg, isError) {
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (isError ? 'toast-error' : 'toast-info');
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}

function readFile(file, cb) {
  let r = new FileReader();
  r.onload = () => cb(r.result.split(',')[1]);
  r.readAsDataURL(file);
}

function handleFiles(input) {
  state.files = Array.from(input.files);
  renderFileList();
  if (state.files.length === 1) {
    parseSingle(state.files[0]);
  } else if (state.files.length > 1) {
    document.getElementById('gen-btn').disabled = true;
    document.getElementById('gen-batch-btn').disabled = false;
    document.getElementById('preview').innerHTML = '<div class="empty"><div class="icon">📁</div>已选择 ' + state.files.length + ' 个文件<br><span style="font-size:12px;color:#aaa">点击「批量生成」处理全部</span></div>';
    document.getElementById('summary').innerHTML = '<div class="section-title">📊 货件信息</div><div class="empty">' + state.files.length + ' 个文件待处理</div>';
  }
}

function renderFileList() {
  let html = '';
  state.files.forEach((f, i) => {
    html += '<div class="file-badge"><span class="idx">' + (i+1) + '</span><span class="name" title="' + esc(f.name) + '">' + esc(f.name) + '</span><span class="remove" onclick="removeFile(' + i + ')">✕</span></div>';
  });
  document.getElementById('file-list').innerHTML = html;
}

function removeFile(idx) {
  state.files.splice(idx, 1);
  let dt = new DataTransfer();
  state.files.forEach(f => dt.items.add(f));
  document.getElementById('file-input').files = dt.files;
  renderFileList();
  if (state.files.length === 0) {
    clearAll();
  } else if (state.files.length === 1) {
    parseSingle(state.files[0]);
  }
}

function parseSingle(file) {
  document.getElementById('preview').innerHTML = '<div class="loading"><span class="spinner"></span>解析中…</div>';
  document.getElementById('gen-btn').disabled = true;
  document.getElementById('gen-batch-btn').disabled = true;
  document.getElementById('dl-btn').style.display = 'none';
  document.getElementById('batch-result').innerHTML = '';

  readFile(file, b64 => {
    fetch('/api/parse', {
      method: 'POST',
      body: JSON.stringify({ file: b64 }),
      headers: {'Content-Type': 'application/json'}
    })
    .then(r => r.json())
    .then(d => {
      if (!d.success) {
        toast('解析失败: ' + d.error, true);
        document.getElementById('preview').innerHTML = '<div class="empty"><div class="icon">❌</div>' + d.error + '</div>';
        return;
      }
      state.parsed = d;
      showPreview(d);
      showSummary(d);
      document.getElementById('gen-btn').disabled = false;
      document.getElementById('gen-batch-btn').disabled = false;
      toast('✓ 解析成功 — ' + d.item_count + ' 个 SKU');
    })
    .catch(e => {
      toast('上传失败', true);
      document.getElementById('preview').innerHTML = '<div class="empty"><div class="icon">❌</div>上传失败</div>';
    });
  });
}

function clearAll() {
  state = { files: [], parsed: null, woven: null, batchResult: null };
  document.getElementById('file-list').innerHTML = '';
  document.getElementById('file-input').value = '';
  document.getElementById('gen-btn').disabled = true;
  document.getElementById('gen-batch-btn').disabled = true;
  document.getElementById('dl-btn').style.display = 'none';
  document.getElementById('batch-result').innerHTML = '';
  document.getElementById('preview').innerHTML = '<div class="empty"><div class="icon">📋</div>上传 FBA 货件 Excel 开始</div>';
  document.getElementById('summary').innerHTML = '<div class="section-title">📊 货件信息</div><div class="empty">等待上传…</div>';
}

function showPreview(d) {
  let html = '<div class="section-title">📋 SKU 明细</div>';
  if (!d.items || d.items.length === 0) {
    html += '<div class="empty">无数据</div>';
  } else {
    html += '<table><tr><th>MSKU</th><th>箱数</th><th>申报量</th><th>箱号</th><th>重量</th><th>尺寸(cm)</th></tr>';
    d.items.forEach(i => {
      let dims = i.length + '×' + i.width + '×' + i.height;
      html += '<tr><td>' + esc(i.msku) + '</td><td>' + i.box_count + '</td><td>' + i.declared_qty + '</td><td>' + esc(i.box_range) + '</td><td>' + i.weight + '</td><td>' + dims + '</td></tr>';
    });
    html += '</table>';
  }
  document.getElementById('preview').innerHTML = html;
}

function showSummary(d) {
  let m = d.meta || {};
  let html = '<div class="section-title">📊 货件信息</div>';
  html += '<div class="info-grid">';
  html += '<div class="info-card"><div class="num">' + (m.total_boxes||'-') + '</div><div class="lbl">箱子数量</div></div>';
  html += '<div class="info-card"><div class="num">' + (d.item_count||'-') + '</div><div class="lbl">SKU 数</div></div>';
  html += '<div class="info-card"><div class="num">' + (m.item_count||'-') + '</div><div class="lbl">商品数量</div></div>';
  html += '<div class="info-card"><div class="num">' + (m.sku_count||'-') + '</div><div class="lbl">SKU 种类</div></div>';
  html += '</div>';
  if (m.shipment_id) html += '<div style="padding:8px;background:#f0f6ff;border-radius:6px;margin-bottom:8px"><span style="color:#888">货件编号</span><br><b>' + esc(m.shipment_id) + '</b></div>';
  document.getElementById('summary').innerHTML = html;
}

function doGenerateSingle() {
  if (state.files.length === 0) return toast('请先上传文件', true);
  let btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.textContent = '⏳ 生成中…';

  readFile(state.files[0], b64 => {
    let body = { file: b64 };
    let hs = document.getElementById('hs-code').value.trim();
    if (hs) body.hs_code = hs;

    fetch('/api/weave', {
      method: 'POST',
      body: JSON.stringify(body),
      headers: {'Content-Type': 'application/json'}
    })
    .then(r => r.json())
    .then(d => {
      btn.disabled = false; btn.textContent = '🧵 单件生成';
      if (!d.success) { toast('生成失败: ' + d.error, true); return; }
      state.woven = d;
      let dl = document.getElementById('dl-btn');
      dl.href = d.download_url;
      dl.download = d.download_url.split('/').pop();
      dl.style.display = 'block';
      dl.textContent = '⬇ 下载装箱单';
      showResultSummary(d);
      showResultRows(d);
      toast('✓ 生成完成');
    })
    .catch(e => { btn.disabled = false; btn.textContent = '🧵 单件生成'; toast('生成失败', true); });
  });
}

function doGenerateBatch() {
  if (state.files.length === 0) return toast('请先上传文件', true);
  let btn = document.getElementById('gen-batch-btn');
  btn.disabled = true; btn.textContent = '⏳ 批量生成中…';
  document.getElementById('batch-result').innerHTML = '<div class="loading"><span class="spinner"></span>处理 ' + state.files.length + ' 个文件…</div>';

  let pending = state.files.length;
  let fileData = [];

  state.files.forEach((file, idx) => {
    readFile(file, b64 => {
      fileData.push({ name: file.name, data: b64 });
      pending--;
      if (pending === 0) doBatchCall(fileData, btn);
    });
  });
}

function doBatchCall(fileData, btn) {
  let hs = document.getElementById('hs-code').value.trim();
  fetch('/api/weave-batch', {
    method: 'POST',
    body: JSON.stringify({ files: fileData, hs_code: hs || undefined }),
    headers: {'Content-Type': 'application/json'}
  })
  .then(r => r.json())
  .then(d => {
    btn.disabled = false; btn.textContent = '📦 批量生成';
    if (!d.success) { toast('批量生成失败: ' + d.error, true); return; }
    state.batchResult = d;
    showBatchResult(d);
    let ok = d.results.filter(r => r.success).length;
    toast('✓ 批量完成 — ' + ok + '/' + d.results.length + ' 成功');
  })
  .catch(e => { btn.disabled = false; btn.textContent = '📦 批量生成'; toast('生成失败', true); });
}

function showBatchResult(d) {
  let html = '<div style="margin-top:8px">';
  if (d.zip_b64) {
    html += '<a class="btn btn-zip" href="javascript:void(0)" onclick="downloadZipB64(\'' + d.zip_b64 + '\')" style="margin-bottom:8px">📥 批量下载 ZIP</a>';
  }
  d.results.forEach((r, i) => {
    if (r.success) {
      html += '<div style="font-size:12px;padding:4px 0"><span class="ok">✓</span> ' + esc(r.shipment_id) + ' <a href="' + r.download_url + '" style="color:#4a90d9;font-size:11px">下载</a></div>';
    } else {
      html += '<div style="font-size:12px;padding:4px 0"><span class="fail">✗</span> ' + esc(r.filename) + ' — ' + esc(r.error) + '</div>';
    }
  });
  html += '</div>';
  document.getElementById('batch-result').innerHTML = html;

  let okCount = d.results.filter(r => r.success).length;
  let metaHtml = '<div class="section-title">📊 批量生成结果</div>';
  metaHtml += '<div class="info-grid">';
  metaHtml += '<div class="info-card"><div class="num">' + d.results.length + '</div><div class="lbl">总文件数</div></div>';
  metaHtml += '<div class="info-card"><div class="num" style="color:#27ae60">' + okCount + '</div><div class="lbl">成功</div></div>';
  metaHtml += '</div>';
  document.getElementById('summary').innerHTML = metaHtml;
}

function showResultSummary(d) {
  let s = d.summary || {};
  let html = '<div class="section-title">📊 生成结果</div>';
  html += '<div class="info-grid">';
  html += '<div class="info-card"><div class="num">' + (s.total_boxes||'-') + '</div><div class="lbl">总箱数</div></div>';
  html += '<div class="info-card"><div class="num">' + (s.total_weight||'-') + '</div><div class="lbl">总重量 kg</div></div>';
  html += '<div class="info-card"><div class="num">' + (s.total_cbm||'-') + '</div><div class="lbl">总体积 CBM</div></div>';
  html += '<div class="info-card"><div class="num">' + (s.row_count||'-') + '</div><div class="lbl">数据行</div></div>';
  html += '</div>';
  if (s.shipment_id) html += '<div style="padding:8px;background:#eafaf1;border-radius:6px;font-size:12px;color:#666">Shipment ID: <b>' + esc(s.shipment_id) + '</b></div>';
  document.getElementById('summary').innerHTML = html;
}

function showResultRows(d) {
  let rows = d.rows || [];
  let html = '<div class="section-title">📋 装箱单明细</div>';
  html += '<table><tr><th>箱号段</th><th>件数</th><th>SKU</th><th>HS</th><th>数量</th><th>重量</th><th>尺寸</th></tr>';
  rows.forEach(r => {
    let dims = r['长'] + '×' + r['宽'] + '×' + r['高'];
    html += '<tr><td>' + esc(r['箱号段']) + '</td><td>' + r['总件数'] + '</td><td>' + esc(r['SKU']) + '</td><td>' + esc(r['海关编码']) + '</td><td>' + r['总数量'] + '</td><td>' + r['单箱重量'] + '</td><td>' + dims + '</td></tr>';
  });
  html += '</table>';
  document.getElementById('preview').innerHTML = html;
}

function downloadZipB64(b64) {
  let raw = atob(b64);
  let arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  let blob = new Blob([arr], {type: 'application/zip'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = '装箱单_批量.zip';
  a.click();
  URL.revokeObjectURL(url);
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
